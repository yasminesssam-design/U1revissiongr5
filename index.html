{n:"الدرس الأول",t:"الأجهزة الملحقة بالحاسب الآلي",e:`<h2>🖥️ ملحقات الحاسب الآلي</h2><ul>
<li><b>القرص الصلب الخارجي:</b> أسرع من القرص الصلب التقليدي (HDD) لأنه يتصل مباشرة بمنفذ الحاسب.</li>
<li><b>كابل ومنفذ الإيثرنت (Ethernet):</b> يربط الحاسب بالموجّه (Router)، وهو أسرع وأكثر استقرارًا من الواي فاي.</li>
<li><b>ذاكرة الفلاش (USB أو SSD):</b> سريعة جدًا لأنها لا تحتوي على أجزاء متحركة.</li>
<li><b>الموجّه (Router):</b> يوصل عدة أجهزة بالإنترنت عبر الواي فاي أو الإيثرنت.</li>
<li><b>كابل HDMI:</b> ينقل الصوت والفيديو بين الأجهزة.</li></ul>
<h2>📏 وحدات القياس</h2><ul>
<li>بت (bit) أصغر وحدة بيانات، والبايت (Byte) = 8 بت ويمثل حرفًا واحدًا.</li>
<li>1 كيلوبايت = 1024 بايت ← 1 ميجابايت = 1024 كيلوبايت ← 1 جيجابايت = 1024 ميجابايت ← 1 تيرابايت = 1024 جيجابايت.</li>
<li><b>ميجابت في الثانية (Mbps):</b> لقياس سرعة الشبكة أو الإنترنت.</li>
<li><b>هيرتز (Hz):</b> لقياس سرعة المعالج (عدد الدورات في الثانية).</li></ul>
<h2>🛠️ مشكلات وحلولها</h2><ul>
<li>لا تظهر صورة على الشاشة ← تأكد من إحكام كابل HDMI أو جرّب كابلًا آخر.</li>

{n:"الدرس الثاني",t:"الشبكات وأنواعها",e:`<h2>🌐 ما هي الشبكات (Networks)؟</h2><ul>
<li>الشبكات مجموعات من الأشخاص أو الأجهزة المرتبطة ببعضها لهدف مشترك.</li></ul>
<h2>أنواع شبكات الحاسب</h2><ul>
<li><b>الشبكة المحلية (LAN):</b> تربط أجهزة الحاسب داخل منزل أو مكتب صغير، ويمكنها ربط الطابعات والراوتر.</li>
<li><b>الإنترنت (Internet):</b> شبكة عالمية تربط ملايين أجهزة الحاسب حول العالم.</li></ul>
<h2>🔌 كيف نتصل بالإنترنت؟</h2><ul>
<li>نحتاج إلى <b>بوابة (Gateway)</b> مثل الراوتر، وهو يربط جهازك بمزود خدمة الإنترنت.</li>
<li><b>مزود خدمة الإنترنت (ISP):</b> شركة تقدم خدمة الإنترنت للعملاء.</li>
<li>الإنترنت يشبه مكتبة ضخمة فيها كتب وصور وفيديوهات ومواقع، ومن المواقع المفيدة: <b>بنك المعرفة المصري (EKB)</b>.</li></ul>
<h2>🔓 الشبكات المفتوحة والمغلقة</h2><ul>
<li><b>الشبكة المفتوحة:</b> متاحة للجميع، مثل الإنترنت والشبكة العنكبوتية العالمية (WWW).</li>
<li><b>الشبكة المغلقة:</b> شبكة خاصة، مثل الإنترانت ومعمل الكمبيوتر بالمدرسة.</li></ul>`,

{n:"الدرس الثالث",t:"أنظمة التواصل الذكية",e:`<h2>📱 أنظمة التواصل الذكية</h2><ul>
<li>أصبحت جزءًا من حياتنا اليومية، فنستخدم شبكات الحاسب في: إرسال رسالة نصية، التسوق عبر الإنترنت، مشاركة دروسنا، رفع أو تحميل مقاطع الفيديو.</li></ul>
<h2>🔓 أنواع الشبكات</h2><ul><li>تستخدم الشركات نوعين: <b>شبكات مغلقة</b> (للمعلومات الخاصة) و<b>شبكات مفتوحة</b> (للمعلومات العامة).</li></ul>
<h2>🏠 إنترنت الأشياء (IoT)</h2><ul>
<li>تقنية تربط الأجهزة الرقمية بالإنترنت من خلال الواي فاي وتسمح بالتحكم فيها عن بُعد.</li>
<li>مثال: مكبرات الصوت التي تعمل بالبلوتوث، ونقل البيانات لاسلكيًا بين الأجهزة على مسافات قصيرة.</li>
<li>البلوتوث يُستخدم أيضًا لنقل البيانات بين الأجهزة المحمولة لاسلكيًا.</li></ul>
<h2>♿ أهمية الشبكات لذوي الاحتياجات الخاصة</h2><ul>
<li>تمنحهم استقلالية وثقة بالنفس: الوصول للمعلومات، التسوق عبر الإنترنت (التجارة الإلكترونية).</li>
<li>تساعد ضعاف البصر: قارئات الشاشة لأداء الواجبات، القراءة بطريقة برايل، كتابة الأبحاث، الوصول للملفات المهمة.</li></ul>`,

["... يسمح لك بالتحكم في الأجهزة المتصلة بالإنترنت عن طريق Wi-Fi.",["البريد الإلكتروني","محرك البحث","إنترنت الأشياء","موقع التواصل"],2],
["تمنح ... الأشخاص ذوي الهمم مزيدًا من الاستقلالية وزيادة ثقتهم بأنفسهم.",["الراوتر","شبكات الحاسب الآلي","الكاميرا","الطابعات"],1],

{n:"الدرس الرابع",t:"مشكلات الاتصال بالإنترنت وخطوات حلها",e:`<h2>🧩 خطوات حل المشكلات</h2><ul>
<li><b>1) تحديد المشكلة:</b> هل هي في الأجهزة (Hardware) أم البرامج (Software) أم خطأ من المستخدم؟</li>
<li><b>2) التخطيط للحلول:</b> التفكير فيما قد يُصلح المشكلة.</li>
<li><b>3) تجربة الحلول:</b> تطبيق الحلول واحدًا تلو الآخر حتى تجد ما يعمل.</li>
<li><b>4) المراجعة:</b> أي حل نجح ولماذا؟ وإن لم ينجح شيء فماذا تعلمت؟</li>
<li><b>5) طلب المساعدة:</b> من معلمك أو أحد أفراد عائلتك.</li></ul>
<h2>🔧 مشكلات شائعة وحلولها</h2><ul>
<li>بطء الحاسب عند فتح التطبيقات ← إعادة التشغيل، التحقق من التحديثات، حذف التطبيقات غير المرغوبة.</li>
<li>بطء المتصفح ← فحص إشارة الواي فاي، تحديث التطبيقات.</li>
<li>بطء التحميل ← إعادة تشغيل الحاسب والراوتر، التحقق من سرعة الإنترنت.</li>
<li>عدم وجود اتصال بالإنترنت ← أداة إصلاح الواي فاي، التحقق من الراوتر، إعادة تشغيله، التواصل مع مزود الخدمة، تجربة كابل إيثرنت جديد.</li></ul>`,

{n:"الدرس الخامس",t:"الملفات الرقمية وكيفية التعامل معها",e:`<h2>🎙️ ملحقات الأجهزة الإلكترونية</h2><ul>
<li>أجهزة توصل بالحاسب لتساعدنا على إنجاز المهام.</li>
<li><b>وحدات الإدخال:</b> لوحة المفاتيح، الميكروفون، كاميرا الويب، الماسح الضوئي — لإدخال النصوص والأصوات والفيديو والصور.</li></ul>
<h2>💾 حفظ الملفات</h2><ul>
<li><b>القرص الصلب (HDD):</b> المكان الرئيسي لحفظ الملفات، بمساحة تخزينية كبيرة جدًا.</li>
<li><b>ذاكرة الفلاش:</b> جهاز صغير متنقل نضع فيه الملفات وننقلها إلى أي جهاز آخر.</li></ul>
<h2>⚠️ وحدات التخزين مجهولة المصدر</h2><ul>
<li>قد تعرّض الأجهزة والبيانات للفيروسات أو سرقة المعلومات، فتجنب توصيلها بالجهاز.</li>
<li>استخدم فلاش موثوقة، وافحصها ببرنامج مكافحة فيروسات محدّث قبل فتح ملفاتها.</li></ul>
<h2>📁 إدارة الملفات</h2><ul>
<li>تعني تنظيم الملفات بطريقة تسهّل إيجادها: إنشاء المجلدات (المجلد مثل الصندوق)، وتسمية الملفات بأسماء واضحة، ونقلها.</li>
<li><b>إنشاء مجلد جديد:</b> زر الفأرة الأيمن في مساحة فارغة ← New (جديد) ← Folder (مجلد) ← اكتب الاسم ← اضغط Enter.</li>
<li>المجلد الرئيسي يمكن أن يحتوي على مجلد فرعي واحد أو أكثر.</li></ul>`,

{n:"الدرس السادس",t:"مشاركة المعلومات: متى؟ وأين؟ وكيف؟",e:`<h2>🏠 الشبكة الداخلية (الإنترانت)</h2><ul>
<li>تشبه عائلتنا؛ مكان آمن لمشاركة المعلومات مع أشخاص نعرفهم ونثق بهم فقط (معلمك – زملاؤك).</li>
<li>في المنزل: إرسال صورة عائلية لأخيك أو أختك. في المدرسة: إرسال واجب لمعلمك أو مشاركة مشروع مع زملائك.</li></ul>
<h2>🌍 شبكة الإنترنت</h2><ul>
<li>العالم الكبير فيه كل أنواع الناس والغرباء؛ لذلك يجب أن نكون <b>حذرين جدًا</b>.</li>
<li>نشارك المعلومات العامة (فيديو رحلة لحديقة الحيوان) أو المعلومات المفيدة للجميع (معلومات علمية في مدوّنة).</li>
<li>🚫 <b>لا تشارك أبدًا:</b> اسمك بالكامل، عنوان منزلك، رقم هاتفك.</li></ul>
<h2>📊 برامج الجداول الحسابية (Excel)</h2><ul>
